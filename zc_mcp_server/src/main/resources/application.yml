server:
  port: 8088

spring:
  application:
    name: weather-mcp-server
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        name: weather-server
        version: 1.0.0
        type: SYNC
        # WebMVC starter 使用 SSE，不要用 stdio（stdio 需换 spring-ai-starter-mcp-server 依赖）
        protocol: SSE
        enabled: true

logging:
  level:
    root: WARN
    com.zc: INFO
